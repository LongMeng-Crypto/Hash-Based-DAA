[package]
name = "daa_sha256_backend_host"
version = "0.1.0"
edition = "2021"
default-run = "daa_sha256_backend_host"

[features]
cuda = ["risc0-zkvm/cuda"]

[dependencies]
methods = { package = "daa_sha256_backend_methods", path = "../methods" }
risc0-zkvm = { version = "^3.0.4", features = ["prove"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rand_core = "0.6"
aes = "0.8"

[build-dependencies]
cc = "1.2"
