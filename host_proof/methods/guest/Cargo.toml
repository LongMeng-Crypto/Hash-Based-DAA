[package]
name = "guest"
version = "0.1.0"
edition = "2021"

[workspace]

[build-dependencies]
cc = "1.2"

[dependencies]
risc0-zkvm = { version = "^3.0.4", default-features = false, features = ['std'] }
serde = { version = "1", features = ["derive", "alloc"], default-features = false }
aes = { version = "0.8", default-features = false }
risc0-zkvm-platform = { version = "2.2.1", default-features = false }
